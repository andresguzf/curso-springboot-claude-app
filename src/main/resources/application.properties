spring.application.name=1-spring-app

# ===== Servidor =====
server.port=8080

# ===== Content negotiation: formato por parámetro en la URL (?format=json o ?format=xml) =====
spring.mvc.contentnegotiation.favor-parameter=true
spring.mvc.contentnegotiation.parameter-name=format
spring.mvc.contentnegotiation.media-types.json=application/json
spring.mvc.contentnegotiation.media-types.xml=application/xml

# ===== DevTools: reinicio automático y recarga en caliente =====
# Reinicia la app al detectar cambios en el classpath (al compilar)
spring.devtools.restart.enabled=true
# Recarga el navegador automáticamente con LiveReload
spring.devtools.livereload.enabled=true
# Tiempo de espera para agrupar cambios antes de reiniciar
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
# Archivos estáticos que no provocan reinicio (solo recarga)
spring.devtools.restart.exclude=static/**,public/**,templates/**

# ===== SpringDoc OpenAPI / Swagger UI =====
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.packages-to-scan=com.andres.course.claude.springboot

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
